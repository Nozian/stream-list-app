<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Prime Video・Netflix・U-NEXTの観たい作品を一元管理する個人ライブラリ"><title>SWO — あなたの観たいを、ひとつに。</title><link rel="stylesheet" href="style.css"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c8df91'/%3E%3Cpath d='m12 8 13 8-13 8z' fill='%23232620'/%3E%3C/svg%3E"></head><body>
<aside><a class="brand" href="./">swo<span>STREAMING WATCHLIST ORGANIZER</span></a><p class="eyebrow">YOUR COLLECTION</p><nav id="services"></nav><div class="aside-note">サービスを越えて、<br>好きな作品が集まる場所。</div><p class="local" id="sync-status">● 同期を準備中</p><button id="backup">バックアップを書き出す</button><button id="import">JSON / CSVを取り込む</button><input id="file" type="file" accept=".json,.csv,application/json,text/csv" hidden></aside>
<main><header><span>MY LIBRARY / PERSONAL ARCHIVE</span><div class="header-actions"><button id="share-app">共有</button><button class="primary" id="add">＋ 作品を追加</button></div></header><section class="intro"><p class="eyebrow">A LITTLE LESS SCROLLING. A LITTLE MORE WATCHING.</p><h1>あなたの「観たい」を、<br><em>ひとつのライブラリに。</em></h1><p>映画も、アニメも、ドキュメンタリーも。次に出会う一本をここから。</p></section><div class="tools"><label class="search">⌕ <input id="search" placeholder="作品名・ジャンル・メモで検索" aria-label="作品を検索"></label><button id="random">↝ 今夜の一本</button><button id="csv">CSV出力</button></div><div class="filters"><div id="types"></div><select id="status" aria-label="視聴状態"><option value="all">すべての視聴状態</option><option value="unwatched">観たい</option><option value="watched">視聴済み</option></select><select id="sort" aria-label="並び替え"><option value="added">追加した順</option><option value="title">タイトル順</option><option value="rating">評価が高い順</option></select></div><div class="section-head"><h2>マイライブラリ <span id="count"></span></h2><span id="summary"></span></div><div id="grid"></div><footer>SWO / 観たい気持ちを、置き去りにしない。<span>CLOUD EDITION · 02</span></footer></main>
<dialog id="editor"><form id="form"><div class="dialog-head"><h2 id="editor-title">作品を追加</h2><button type="button" id="close" aria-label="閉じる">×</button></div><label>作品名<input name="title" required maxlength="250"></label><div class="row"><label>種類<select name="type"><option>映画</option><option>アニメ</option><option>ドキュメンタリー</option><option>シリーズ</option><option>未分類</option></select></label><label>サービス<select name="service"><option value="prime">Prime Video</option><option value="netflix">Netflix</option><option value="unext">U-NEXT</option></select></label></div><label>ジャンル<input name="genre" placeholder="例：SF・ファンタジー" maxlength="100"></label><label>作品のURL（任意）<input name="href" type="url" placeholder="https://..."></label><div class="row"><label>視聴状態<select name="watched"><option value="false">観たい</option><option value="true">視聴済み</option></select></label><label>評価<select name="star"><option value="0">未評価</option><option value="1">★</option><option value="2">★★</option><option value="3">★★★</option></select></label></div><label>メモ<textarea name="memo" rows="3" maxlength="5000" placeholder="気になった理由や、観終わった感想を。"></textarea></label><div class="dialog-actions"><button type="button" id="delete">この作品を削除</button><button class="primary">保存する</button></div></form></dialog><div id="notice" role="status" aria-live="polite"></div><script type="module" src="app.js"></script></body></html>
